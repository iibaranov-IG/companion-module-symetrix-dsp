name: Control variable regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the existing module runtime and base 1.4.3 engine requirement.
          node-version: '18.20.8'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
